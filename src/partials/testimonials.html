<section class="testimonials" id="testimonials">
    <div class="testimonials-container">
        <h2 class="testimonials-title">Customer testimonials</h2>

        <p class="testimonials-subtitle">
            Authenticity has my new earrings! They are amazing.
        </p>

        <div class="testimonials-grid">
            <div class="testimonials-images">
                <picture>
                    <source media="(min-width: 1440px)" srcset="
              ./images/testimonials/testimonials1-desktop.webp 1x,
              ./images/testimonials/testimonials1-desktop@2x.webp 2x
            " />
                    <source media="(min-width: 768px)" srcset="
              ./images/testimonials/testimonials1-tablet.webp 1x,
              ./images/testimonials/testimonials1-tablet@2x.webp 2x
            " />
                    <source srcset="
              ./images/testimonials/testimonials1-mob.webp 1x,
              ./images/testimonials/testimonials1-mob@2x.webp 2x
            " />
                    <img class="testimonials-image" src="./images/testimonials/testimonials1-mob.webp"
                        alt="Woman wearing handmade jewelry" loading="lazy" decoding="async" />
                </picture>

                <picture>
                    <source media="(min-width: 1440px)" srcset="
              ./images/testimonials/testimonials2-desktop.webp 1x,
              ./images/testimonials/testimonials2-desktop@2x.webp 2x
            " />
                    <source media="(min-width: 768px)" srcset="
              ./images/testimonials/testimonials2-tablet.webp 1x,
              ./images/testimonials/testimonials2-tablet@2x.webp 2x
            " />
                    <source srcset="
              ./images/testimonials/testimonials2-mob.webp 1x,
              ./images/testimonials/testimonials2-mob@2x.webp 2x
            " />
                    <img class="testimonials-image" src="./images/testimonials/testimonials2-mob.webp"
                        alt="Man wearing handmade jewelry" loading="lazy" decoding="async" />
                </picture>
            </div>

            <article class="testimonials-review">
                <p class="testimonials-rating" aria-label="Rating 4 out of 5">
                    <span aria-hidden="true">★★★★☆</span>
                </p>

                <p class="testimonials-text">
                    “Each piece tells a story, and I love mine!”
                </p>

                <p class="testimonials-author">Thomas Moore</p>
            </article>

            <article class="testimonials-review">
                <p class="testimonials-rating" aria-label="Rating 5 out of 5">
                    <span aria-hidden="true">★★★★★</span>
                </p>

                <p class="testimonials-text">
                    “The craftsmanship is exquisite, and I feel unique wearing it.”
                </p>

                <p class="testimonials-author">Jane Wilson</p>
            </article>

            <div class="testimonials-images">
                <picture>
                    <source media="(min-width: 1440px)" srcset="
              ./images/testimonials/testimonials3-desktop.webp 1x,
              ./images/testimonials/testimonials3-desktop@2x.webp 2x
            " />
                    <source media="(min-width: 768px)" srcset="
              ./images/testimonials/testimonials3-tablet.webp 1x,
              ./images/testimonials/testimonials3-tablet@2x.webp 2x
            " />
                    <source srcset="
              ./images/testimonials/testimonials3-mob.webp 1x,
              ./images/testimonials/testimonials3-mob@2x.webp 2x
            " />
                    <img class="testimonials-image" src="./images/testimonials/testimonials3-mob.webp"
                        alt="Woman holding handmade jewelry" loading="lazy" decoding="async" />
                </picture>

                <picture>
                    <source media="(min-width: 1440px)" srcset="
              ./images/testimonials/testimonials4-desktop.webp 1x,
              ./images/testimonials/testimonials4-desktop@2x.webp 2x
            " />
                    <source media="(min-width: 768px)" srcset="
              ./images/testimonials/testimonials4-tablet.webp 1x,
              ./images/testimonials/testimonials4-tablet@2x.webp 2x
            " />
                    <source srcset="
              ./images/testimonials/testimonials4-mob.webp 1x,
              ./images/testimonials/testimonials4-mob@2x.webp 2x
            " />
                    <img class="testimonials-image" src="./images/testimonials/testimonials4-mob.webp"
                        alt="Handmade jewelry" loading="lazy" decoding="async" />
                </picture>
            </div>
        </div>
    </div>
</section>
